name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install "Newsreader" and "Geist"
        env:
          GOOGLE_FONTS_REV: 9710da1eacb3be272583c3224dcb70f9da6eadbb
        run: |
          base="https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_REV/ofl"
          mkdir -p fonts
          curl -fsSL -o "fonts/Newsreader[opsz,wght].ttf" "$base/newsreader/Newsreader%5Bopsz%2Cwght%5D.ttf"
          curl -fsSL -o "fonts/Newsreader-Italic[opsz,wght].ttf" "$base/newsreader/Newsreader-Italic%5Bopsz%2Cwght%5D.ttf"
          curl -fsSL -o "fonts/Geist[wght].ttf" "$base/geist/Geist%5Bwght%5D.ttf"
      - name: Install "Juisee"
        env:
          JUISEE_VERSION: v0.2.0
        run: |
          mkdir -p fonts
          curl -fsSL -o "$RUNNER_TEMP/juisee.zip" "https://github.com/yuru7/juisee/releases/download/$JUISEE_VERSION/Juisee_$JUISEE_VERSION.zip"
          unzip -j "$RUNNER_TEMP/juisee.zip" "Juisee_$JUISEE_VERSION/Juisee-*.ttf" -d fonts
      - name: Install "Material Symbols Outlined"
        env:
          MATERIAL_ICONS_REV: 10ecc14790612ca8fd164e3f4ffe9c16fc50d5b7
        run: |
          mkdir -p fonts
          curl -fsSL -o "fonts/MaterialSymbolsOutlined[FILL,GRAD,opsz,wght].ttf" "https://raw.githubusercontent.com/google/material-design-icons/$MATERIAL_ICONS_REV/variablefont/MaterialSymbolsOutlined%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      # システムフォントに頼らず，取得したフォントと Typst 同梱フォントだけでビルドする
      - run: typst compile --ignore-system-fonts --font-path fonts main.typ main.pdf
      - name: Create page directory
        run: |
          mkdir _pages
          mv ./main.pdf ./_pages/main.pdf
          echo "<meta http-equiv=\"refresh\" content=\"0;URL='$(gh api "repos/$GITHUB_REPOSITORY" --jq '.html_url')'\">" > ./_pages/index.html
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
